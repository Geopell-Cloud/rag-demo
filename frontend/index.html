<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAG Demo</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="title"><span class="dot"></span> RAG Demo Chat App</div>
  <button id="clear-btn">Clear chat</button>
</header>

<main>
  <div id="chat-panel">
    <div id="log">
      <div id="empty-state">
        <h1>Ask a question or try one of the examples</h1>
        <p>Answers are from the documents that are indexed from your data source, with citations you can inspect.</p>
        <div class="examples" id="examples"></div>
      </div>
    </div>
    <div id="input-bar">
      <input id="question" placeholder="Type a new question..." autocomplete="off" />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <aside id="citations-panel">
    <button class="close-btn" id="close-citations">Close ✕</button>
    <h3 id="citation-title">Citation</h3>
    <div class="source-name" id="citation-source"></div>
    <div class="source-text" id="citation-text"></div>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
