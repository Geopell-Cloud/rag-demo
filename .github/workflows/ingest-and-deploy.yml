name: Ingest Data and Deploy RAG App

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_STORAGE_ACCOUNT: ragstoragedevstqsfd
  AZURE_STORAGE_CONTAINER: rag-container
  AZURE_SEARCH_INDEX: rag-index
  AZURE_OPENAI_CHAT_DEPLOYMENT: gpt-5.1
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: text-embedding-3-small

jobs:
  # ------------------------------------------------------------------
  # Reads endpoints and resource names from Terraform outputs
  # ------------------------------------------------------------------
  get-endpoints:
    name: "Terraform Endpoints and Resource Names"
    runs-on: ubuntu-latest
    environment: dev

    outputs:
      search_endpoint: ${{ steps.tf.outputs.search_endpoint }}
      docintel_endpoint: ${{ steps.tf.outputs.docintel_endpoint }}
      openai_endpoint: ${{ steps.tf.outputs.openai_endpoint }}
      storage_account_name: ${{ steps.tf.outputs.storage_account_name }}
      function_app_name: ${{ steps.tf.outputs.function_app_name }}
      resource_group_name: ${{ steps.tf.outputs.resource_group_name }}

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_USE_OIDC: "true"  # uses OIDC instead of client secret
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false   # keeps `terraform output` stdout clean

      - name: Initialize Terraform
        run: terraform init

      - name: Read Terraform Outputs
        id: tf
        run: |
          set -euo pipefail

          get() {
            local val
            val=$(terraform output -raw "$1")
            if [ -z "$val" ]; then
              echo "::error::Terraform output '$1' is empty or missing"
              exit 1
            fi
            echo "$val"
          }

          search_endpoint=$(get search_endpoint)
          docintel_endpoint=$(get docintel_endpoint)
          openai_endpoint=$(get openai_endpoint)

          for u in "$search_endpoint" "$docintel_endpoint" "$openai_endpoint"; do
            case "$u" in
              https://*) ;;
              *) echo "::error::Unexpected endpoint value in Terraform outputs"; exit 1 ;;
            esac
          done

          # None of these are credentials, so they are not masked
          {
            echo "search_endpoint=${search_endpoint%/}"
            echo "docintel_endpoint=${docintel_endpoint%/}"
            echo "openai_endpoint=${openai_endpoint%/}"
            echo "storage_account_name=$(get storage_account_name)"
            echo "function_app_name=$(get function_app_name)"
            echo "resource_group_name=$(get resource_group_name)"
          } >> "$GITHUB_OUTPUT"

      - name: Debug - dump this job's GITHUB_OUTPUT (temporary)
        run: cat "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Uploads ./data to Blob Storage, builds the index, and ingests
  # ------------------------------------------------------------------
  ingest:
    name: "Create Index and Ingest Docs"
    runs-on: ubuntu-latest
    environment: dev
    needs: get-endpoints
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Upload Data Folder to Blob Storage
        run: |
          az storage blob upload-batch \
            --account-name "${{ env.AZURE_STORAGE_ACCOUNT }}" \
            --destination "${{ env.AZURE_STORAGE_CONTAINER }}" \
            --source "data" \
            --auth-mode login \
            --overwrite

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ingestion Dependencies
        working-directory: ./ingestion
        run: pip install -r requirements-ingest.txt

      - name: Debug - show resolved endpoint (temporary)
        env:
          AZURE_SEARCH_ENDPOINT: ${{ needs.get-endpoints.outputs.search_endpoint }}
        run: |
          echo "length: ${#AZURE_SEARCH_ENDPOINT}"
          echo "first 20 chars: ${AZURE_SEARCH_ENDPOINT:0:20}"
          echo "starts with https: $([[ "$AZURE_SEARCH_ENDPOINT" == https://* ]] && echo yes || echo no)"

      - name: Debug - show role assignments on the search service (temporary)
        env:
          AZURE_SEARCH_ENDPOINT: ${{ needs.get-endpoints.outputs.search_endpoint }}
          RESOURCE_GROUP: ${{ needs.get-endpoints.outputs.resource_group_name }}
        run: |
          set -euo pipefail

          # Pull the search service name back out of its endpoint
          # (https://<name>.search.windows.net -> <name>)
          search_name=$(echo "$AZURE_SEARCH_ENDPOINT" | sed -E 's#https://([^.]+)\..*#\1#')
          echo "search service name: $search_name"

          sub_id=$(az account show --query id -o tsv)
          search_scope="/subscriptions/${sub_id}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Search/searchServices/${search_name}"
          echo "scope queried: $search_scope"

          # Resolve the service principal's object id from its client (app) id.
          # Role assignments are keyed by object id, not client id.
          principal_id=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
          echo "principal_id: $principal_id"

          # List role assignments at this scope via the ARM REST API directly,
          # then filter down to just this principal and resolve role names.
          az rest --method get \
            --url "https://management.azure.com${search_scope}/providers/Microsoft.Authorization/roleAssignments" \
            --url-parameters "api-version=2022-04-01" \
            --query "value[?properties.principalId=='${principal_id}'].properties.roleDefinitionId" \
            -o tsv \
          | while read -r role_def_id; do
              az role definition list --custom-role-only false \
                --query "[?id=='${role_def_id}'].roleName" -o tsv 2>/dev/null \
                || echo "$role_def_id"
            done

      - name: Debug - show search service network rules (temporary)
        env:
          AZURE_SEARCH_ENDPOINT: ${{ needs.get-endpoints.outputs.search_endpoint }}
          RESOURCE_GROUP: ${{ needs.get-endpoints.outputs.resource_group_name }}
        run: |
          set -euo pipefail

          search_name=$(echo "$AZURE_SEARCH_ENDPOINT" | sed -E 's#https://([^.]+)\..*#\1#')

          az search service show \
            --name "$search_name" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{publicNetworkAccess: publicNetworkAccess, networkRuleSet: networkRuleSet}" \
            -o json

      - name: Create Search Index
        working-directory: ./ingestion
        env:
          AZURE_SEARCH_ENDPOINT: ${{ needs.get-endpoints.outputs.search_endpoint }}
        run: python create_index.py

      - name: Check Deployment
        run: |
          az cognitiveservices account deployment list \
            --name cog-acc-openai-rag \
            --resource-group ${{ needs.get-endpoints.outputs.resource_group_name }} \
            --query "[].{DeploymentName:name, Model:properties.model.name, Status:properties.provisioningState}" \
            -o table

      - name: Ingest Documents
        working-directory: ./ingestion
        env:
          AZURE_STORAGE_ACCOUNT_URL: https://${{ needs.get-endpoints.outputs.storage_account_name }}.blob.core.windows.net
          AZURE_SEARCH_ENDPOINT: ${{ needs.get-endpoints.outputs.search_endpoint }}
          AZURE_DOCUMENTINTELLIGENCE_ENDPOINT: ${{ needs.get-endpoints.outputs.docintel_endpoint }}
          AZURE_OPENAI_ENDPOINT: ${{ needs.get-endpoints.outputs.openai_endpoint }}
        run: python ingest.py

  # ------------------------------------------------------------------
  # Packages and deploys the Function App backend
  # ------------------------------------------------------------------
  deploy-function-app:
    name: "Deploy Function App"
    runs-on: ubuntu-latest
    environment: dev
    needs: [get-endpoints, ingest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements-backend.txt \
            --target=".python_packages/lib/site-packages"

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.get-endpoints.outputs.function_app_name }}
          package: ./backend
          scm-do-build-during-deployment: false
          enable-oryx-build: false

      - name: Configure App Settings
        run: |
          az functionapp config appsettings set \
            --name "${{ needs.get-endpoints.outputs.function_app_name }}" \
            --resource-group "${{ needs.get-endpoints.outputs.resource_group_name }}" \
            --settings \
              AZURE_SEARCH_ENDPOINT="${{ needs.get-endpoints.outputs.search_endpoint }}" \
              AZURE_SEARCH_INDEX="${{ env.AZURE_SEARCH_INDEX }}" \
              AZURE_OPENAI_ENDPOINT="${{ needs.get-endpoints.outputs.openai_endpoint }}" \
              AZURE_OPENAI_CHAT_DEPLOYMENT="${{ env.AZURE_OPENAI_CHAT_DEPLOYMENT }}" \
              AZURE_OPENAI_EMBEDDING_DEPLOYMENT="${{ env.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}" \
            --output none
